<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distribuições - Aí 'Se Cream</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; color: #333; }
        nav { background: #1a1a2e; padding: 14px 24px; display: flex; align-items: center; flex-wrap: wrap; gap: 16px 24px; }
        nav .nav-spacer { flex: 1; min-width: 8px; }
        nav .nav-logout { margin: 0; }
        nav .btn-nav-logout {
            background: transparent; color: #e8c84a; border: 1px solid #e8c84a;
            padding: 6px 14px; border-radius: 5px; font-size: 13px; font-weight: 600;
            cursor: pointer; font-family: inherit;
        }
        nav .btn-nav-logout:hover { background: rgba(232, 200, 74, 0.15); color: #fff; border-color: #fff; }
        nav .brand { color: #e8c84a; font-size: 18px; font-weight: bold; text-decoration: none; }
        nav a { color: #ccc; text-decoration: none; font-size: 14px; }
        nav a:hover { color: #fff; }
        .container { max-width: 1280px; margin: 32px auto; padding: 0 16px; }
        .card { background: #fff; border-radius: 8px; padding: 24px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
        h1 { font-size: 22px; color: #1a1a2e; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th { text-align: left; padding: 10px 12px; background: #f0f0f0; border-bottom: 2px solid #ddd; font-weight: 600; }
        td { padding: 10px 12px; border-bottom: 1px solid #eee; vertical-align: top; }
        tr:hover td { background: #fafafa; }
        .btn { display: inline-block; padding: 8px 16px; border-radius: 5px; font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none; border: none; }
        .btn-primary { background: #1a1a2e; color: #fff; }
        .btn-primary:hover { background: #2a2a4e; }
        .btn-danger { background: #e74c3c; color: #fff; }
        .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .badge-success { background: #d4edda; color: #155724; }
        .badge-muted { background: #e9ecef; color: #495057; }
        .alert { padding: 12px 16px; border-radius: 6px; margin-bottom: 20px; font-size: 14px; }
        .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-danger { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
        .num { text-align: right; font-variant-numeric: tabular-nums; }
    </style>
    <style th:replace="~{fragments/table-search :: styles}"></style>
</head>
<body>

<div th:replace="~{fragments/nav :: main}"></div>

<div class="container">
    <div class="card">

        <div class="header-row">
            <h1>Distribuições para lojas</h1>
            <a th:href="@{/distribuicoes/novo}" class="btn btn-primary">+ Nova distribuição</a>
        </div>

        <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div>
        <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

        <div th:replace="~{fragments/table-search :: bar('tabela-distribuicoes')}"></div>

        <table id="tabela-distribuicoes">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Lote</th>
                    <th>Sabor</th>
                    <th class="num">Produção inicial (lote)</th>
                    <th>Loja</th>
                    <th class="num">Enviado</th>
                    <th class="num">Saldo no CD após</th>
                    <th>Status</th>
                    <th>Data</th>
                    <th>Por</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${#lists.isEmpty(distribuicoes)}" class="empty-state-row">
                    <td colspan="11" style="text-align:center; color:#999; padding: 24px;">
                        Nenhuma distribuição registrada ainda.
                    </td>
                </tr>
                <tr th:each="d : ${distribuicoes}" class="data-row">
                    <td th:text="${d.id}"></td>
                    <td th:text="${d.lote.id}"></td>
                    <td th:text="${d.lote.sabor.nome}"></td>
                    <td class="num" th:text="${d.quantidadeLoteInicial}"></td>
                    <td th:text="${d.loja.nome}"></td>
                    <td class="num" th:text="${d.quantidade}"></td>
                    <td class="num" th:text="${d.saldoDisponivelCdApos != null ? d.saldoDisponivelCdApos : '—'}"></td>
                    <td>
                        <span th:if="${d.status.name() == 'ATIVA'}" class="badge badge-success">Ativa</span>
                        <span th:if="${d.status.name() == 'CANCELADA'}" class="badge badge-muted">Cancelada</span>
                    </td>
                    <td th:text="${#temporals.format(d.distribuidoEm, 'dd/MM/yyyy HH:mm')}"></td>
                    <td th:text="${d.criadoPor.nome}"></td>
                    <td>
                        <form sec:authorize="hasRole('ADMIN')"
                              th:if="${d.status.name() == 'ATIVA'}"
                              th:action="@{/distribuicoes/cancelar/{id}(id=${d.id})}"
                              method="post"
                              onsubmit="return confirm('Cancelar esta distribuição? O saldo voltará ao lote no estoque disponível.')">
                            <button type="submit" class="btn btn-danger">Cancelar</button>
                        </form>
                        <span th:if="${d.status.name() == 'CANCELADA'}" style="color:#999;">—</span>
                        <span sec:authorize="!hasRole('ADMIN')" th:if="${d.status.name() == 'ATIVA'}" style="color:#999;">—</span>
                    </td>
                </tr>
            </tbody>
        </table>

    </div>
</div>

<script th:replace="~{fragments/table-search :: script}"></script>
</body>
</html>
