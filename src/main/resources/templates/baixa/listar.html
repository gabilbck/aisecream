<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baixas de estoque - Aí 'Se Cream</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; color: #333; }
        nav { background: #1a1a2e; padding: 14px 24px; display: flex; align-items: center; flex-wrap: wrap; gap: 16px 24px; }
        nav .nav-spacer { flex: 1; min-width: 8px; }
        nav .nav-logout { margin: 0; }
        nav .btn-nav-logout {
            background: transparent; color: #e8c84a; border: 1px solid #e8c84a;
            padding: 6px 14px; border-radius: 5px; font-size: 13px; font-weight: 600;
            cursor: pointer; font-family: inherit;
        }
        nav .btn-nav-logout:hover { background: rgba(232, 200, 74, 0.15); color: #fff; border-color: #fff; }
        nav .brand { color: #e8c84a; font-size: 18px; font-weight: bold; text-decoration: none; }
        nav a { color: #ccc; text-decoration: none; font-size: 14px; }
        nav a:hover { color: #fff; }
        .container { max-width: 1200px; margin: 32px auto; padding: 0 16px; }
        .card { background: #fff; border-radius: 8px; padding: 24px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
        h1 { font-size: 22px; color: #1a1a2e; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th { text-align: left; padding: 10px 12px; background: #f0f0f0; border-bottom: 2px solid #ddd; font-weight: 600; }
        td { padding: 10px 12px; border-bottom: 1px solid #eee; vertical-align: top; }
        tr:hover td { background: #fafafa; }
        .btn { display: inline-block; padding: 8px 16px; border-radius: 5px; font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none; border: none; }
        .btn-primary { background: #1a1a2e; color: #fff; }
        .btn-primary:hover { background: #2a2a4e; }
        .btn-secondary { background: #888; color: #fff; }
        .btn-secondary:hover { background: #666; }
        .alert { padding: 12px 16px; border-radius: 6px; margin-bottom: 20px; font-size: 14px; }
        .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-danger { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
        .num { text-align: right; font-variant-numeric: tabular-nums; }
        .filter-bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; margin-bottom: 20px; padding: 16px; background: #f8f8f8; border-radius: 8px; }
        .filter-bar label { font-size: 13px; font-weight: 600; color: #555; display: block; margin-bottom: 6px; }
        .filter-bar select { min-width: 220px; padding: 8px 10px; border-radius: 5px; border: 1px solid #ccc; font-size: 14px; }
        .obs-cell { max-width: 280px; word-break: break-word; color: #555; font-size: 13px; }
    </style>
</head>
<body>

<div th:replace="~{fragments/nav :: main}"></div>

<div class="container">
    <div class="card">

        <div class="header-row">
            <h1>Baixas de estoque</h1>
            <a th:href="@{/baixas/novo}" class="btn btn-primary">+ Nova baixa</a>
        </div>

        <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div>
        <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

        <form class="filter-bar" th:action="@{/baixas}" method="get">
            <div>
                <label for="filtroLoja">Filtrar por loja</label>
                <select id="filtroLoja" name="lojaId">
                    <option value="">Todas</option>
                    <option th:each="lj : ${lojasFiltro}"
                            th:value="${lj.id}"
                            th:selected="${lojaIdFiltro != null ? (lojaIdFiltro == lj.id) : false}"
                            th:text="${lj.nome}"></option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Aplicar</button>
            <a th:href="@{/baixas}" class="btn btn-secondary">Limpar</a>
        </form>

        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Data</th>
                    <th>Loja</th>
                    <th>Lote</th>
                    <th>Sabor</th>
                    <th class="num">Qtd.</th>
                    <th>Observação</th>
                    <th>Registrado por</th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${#lists.isEmpty(baixas)}">
                    <td colspan="8" style="text-align:center; color:#999; padding: 24px;">
                        Nenhuma baixa registrada<span th:if="${lojaIdFiltro != null}"> para esta loja</span>.
                    </td>
                </tr>
                <tr th:each="b : ${baixas}">
                    <td th:text="${b.id}"></td>
                    <td th:text="${#temporals.format(b.criadoEm, 'dd/MM/yyyy HH:mm')}"></td>
                    <td th:text="${b.loja.nome}"></td>
                    <td th:text="${b.lote.id}"></td>
                    <td th:text="${b.lote.sabor.nome}"></td>
                    <td class="num" th:text="${b.quantidade}"></td>
                    <td class="obs-cell" th:text="${b.observacao != null ? b.observacao : '—'}"></td>
                    <td th:text="${b.criadoPor.nome}"></td>
                </tr>
            </tbody>
        </table>

    </div>
</div>

</body>
</html>
